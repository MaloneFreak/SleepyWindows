name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SleepyWindows.csproj -c Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SleepyWindows
          path: bin/Release/net462/SleepyWindows.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net462/SleepyWindows.exe
          generate_release_notes: true
